site_name: Serviço de Pagamentos (exemplos)
site_description: Páginas de exemplo de cada template, preenchidas para um serviço de pagamentos fictício
nav:
  - Início: index.md
  - Tutoriais:
      - Seu primeiro pagamento: tutorials/tutorial.md
      - Onboarding: tutorials/onboarding.md
      - Golden path de um serviço novo: tutorials/golden-path.md
  - Guias:
      - Trocar a chave da API do provedor: how-to-guides/guide.md
      - Estornar um pagamento: how-to-guides/how-to.md
      - "Runbook: muitos pagamentos com erro": how-to-guides/runbook.md
      - Solução de problemas: how-to-guides/troubleshooting.md
  - Referência:
      - Serviço de Pagamentos: reference/service-home.md
      - Operação e suporte: reference/operations.md
      - API de Pagamentos: reference/api-reference.md
      - Página da wiki do time: reference/wiki-page.md
      - Notas de versão: reference/release-notes.md
      - Glossário: reference/glossary.md
  - Explicação:
      - Arquitetura: explanation/architecture.md
      - "ADR 0003: chaves de idempotência": explanation/adr.md
      - "Postmortem: cobranças em dobro": explanation/postmortem.md
      - "RFC 0007: novas tentativas com fila": explanation/rfc.md
  - Sites:
      - "API: API de Pagamentos": sites/api/index.md
      - "API: Autenticação": sites/api/authentication.md
      - "API: Erros": sites/api/errors.md
      - "Biblioteca: payments-client": sites/library/index.md
      - "Biblioteca: Instalação": sites/library/installation.md
      - "Biblioteca: Como contribuir": sites/library/contributing.md
      - "Plataforma: Plataforma de Comércio": sites/platform/index.md
      - "Plataforma: Como pedir acesso": sites/platform/access.md
      - "Plataforma: Suporte e SLAs": sites/platform/support.md
      - "Runbooks: Runbooks de Pagamentos": sites/runbooks/index.md
      - "Runbooks: Escalonamento": sites/runbooks/escalation.md
      - "Projeto: Novo provedor de cartão": sites/project/index.md
      - "Projeto: Cronograma": sites/project/roadmap.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
